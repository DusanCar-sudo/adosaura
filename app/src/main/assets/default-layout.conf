# adosaura — tile layout. Hot-reloaded; edit freely.
# <page> <zone:top|main> <type>[:<arg>] <weight> [span]
#   top  = the horizontal row across the top
#   main = the vertical column below it
#   weight in main spans slots, so 2 makes the middle tile tall
# types: clock, calendar, clockcal, apps:<group>, stats
#
# The default: three tiles across the top, and four slots down the middle with
# the clock + calendar as the tall middle tile. Drag a tile's ↘ handle to
# resize it, or long-press its title for more.

# the top row: three small tiles
0 top  stats        1
0 top  calendar     1
0 top  clock        1

# the column below: four slots, the clock + calendar in the middle
0 main apps:pinned  1
0 main clockcal     2
0 main apps:all     1
